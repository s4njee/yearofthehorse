<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Year of the Horse</title>
    <!-- Inline, so no browser goes looking for /favicon.ico and logs a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111017'/%3E%3Cg stroke='%23ffc94d' stroke-width='1.3' stroke-linecap='round'%3E%3Cpath d='M8 1.8v2.4M8 11.8v2.4M1.8 8h2.4M11.8 8h2.4M3.6 3.6l1.7 1.7M10.7 10.7l1.7 1.7M3.6 12.4l1.7-1.7M10.7 5.3l1.7-1.7'/%3E%3C/g%3E%3Ccircle cx='8' cy='8' r='1.3' fill='%23fff3d1'/%3E%3C/svg%3E"
    />
    <script>
      // Before first paint, so a stored theme never flashes the other one.
      try {
        const theme = localStorage.getItem('yh-theme');
        if (theme === 'light' || theme === 'auto') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
